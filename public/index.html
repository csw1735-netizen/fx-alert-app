<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환율 알림</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f8cff">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --border:#2a2e38; --text:#eef0f3;
    --muted:#8b93a1; --accent:#4f8cff; --up:#ef5350; --down:#3b82f6; --flat:#8b93a1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#0f1115,#14171d); color:var(--text); min-height:100vh; padding:24px 16px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;}
  @media (max-width:520px){ .cards{grid-template-columns:1fr;} }
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .card .label{color:var(--muted); font-size:13px; margin-bottom:8px;}
  .card .rate{font-size:30px; font-weight:700; letter-spacing:-0.5px;}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:14px;}
  .panel h2{font-size:15px; margin:0 0 12px; color:var(--text);}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  label{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  input[type=number]{width:90px; background:#11141a; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:8px; font-size:14px;}
  select{background:#11141a; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:8px; font-size:14px;}
  input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent);}
  button{background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;}
  button.secondary{background:#2a2e38; color:var(--text);}
  button:hover{opacity:0.9;}
  .status{font-size:12px; color:var(--muted); margin-top:10px;}
  .status.ok{color:#4caf50;}
  .status.err{color:#ef5350;}
  .footer{text-align:center; color:var(--muted); font-size:11px; margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>💱 환율 알림</h1>
  <div class="sub">원/달러, 원/엔 환율 · 서버 Web Push · 앱이 꺼져 있어도 알림 수신</div>

  <div class="cards">
    <div class="card">
      <div class="label">USD → KRW (1달러)</div>
      <div class="rate" id="usdRate">--</div>
    </div>
    <div class="card">
      <div class="label">JPY → KRW (100엔)</div>
      <div class="rate" id="jpyRate">--</div>
    </div>
  </div>

  <div class="panel">
    <h2>⚙️ 변동 알림 기준</h2>
    <div class="row">
      <label>기준 단위
        <select id="unitSelect">
          <option value="percent">퍼센트(%)</option>
          <option value="won">원(₩)</option>
        </select>
      </label>
      <label>임계값
        <input type="number" id="thresholdInput" value="0.5" min="0" step="0.1">
      </label>
      <span style="font-size:12px;color:var(--muted)">이상 변동 시 알림 (5분마다 서버가 체크)</span>
    </div>
  </div>

  <div class="panel">
    <h2>⏰ 정기 알림</h2>
    <div class="row">
      <label><input type="checkbox" id="hourlyCheck"> 매시 정각 알림</label>
      <label><input type="checkbox" id="fiveMinCheck"> 5분 단위 알림</label>
    </div>
  </div>

  <div class="panel">
    <h2>🔔 알림 설정</h2>
    <div class="row">
      <button id="subscribeBtn">폰 알림 켜기</button>
      <button class="secondary" id="testBtn">테스트 알림 보내기</button>
    </div>
    <div class="status" id="statusLine">알림 상태: 확인 전</div>
  </div>

  <div class="footer">홈 화면에 추가하면 앱처럼 사용할 수 있어요. 알림은 이 기기가 인터넷에 연결되어 있으면 앱이 꺼져 있어도 수신됩니다.</div>
</div>

<script>
const usdRateEl = document.getElementById('usdRate');
const jpyRateEl = document.getElementById('jpyRate');
const statusLine = document.getElementById('statusLine');
const unitSelect = document.getElementById('unitSelect');
const thresholdInput = document.getElementById('thresholdInput');
const hourlyCheck = document.getElementById('hourlyCheck');
const fiveMinCheck = document.getElementById('fiveMinCheck');
const subscribeBtn = document.getElementById('subscribeBtn');
const testBtn = document.getElementById('testBtn');

function setStatus(msg, cls){
  statusLine.textContent = msg;
  statusLine.className = 'status ' + (cls || '');
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function loadSettings(){
  const res = await fetch('/api/settings');
  const s = await res.json();
  unitSelect.value = s.unit || 'percent';
  thresholdInput.value = (s.threshold !== undefined) ? s.threshold : 0.5;
  hourlyCheck.checked = !!s.hourly;
  fiveMinCheck.checked = !!s.fiveMin;
}

async function saveSettings(){
  await fetch('/api/settings', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      unit: unitSelect.value,
      threshold: parseFloat(thresholdInput.value) || 0,
      hourly: hourlyCheck.checked,
      fiveMin: fiveMinCheck.checked
    })
  });
}
[unitSelect, thresholdInput, hourlyCheck, fiveMinCheck].forEach(el => el.addEventListener('change', saveSettings));

async function loadRates(){
  try{
    const res = await fetch('/api/rates');
    const data = await res.json();
    usdRateEl.textContent = data.usdToKrw.toFixed(2) + ' 원';
    jpyRateEl.textContent = data.jpyToKrw.toFixed(2) + ' 원';
  }catch(e){
    usdRateEl.textContent = '조회 실패';
    jpyRateEl.textContent = '조회 실패';
  }
}

async function registerServiceWorkerAndSubscribe(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    setStatus('이 브라우저는 푸시 알림을 지원하지 않습니다.', 'err');
    return;
  }
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    setStatus('알림 권한이 거부되었습니다.', 'err');
    return;
  }
  const reg = await navigator.serviceWorker.register('/sw.js');
  await navigator.serviceWorker.ready;

  const keyRes = await fetch('/api/vapid-public-key');
  const { publicKey } = await keyRes.json();
  if (!publicKey) {
    setStatus('서버에 VAPID 키가 설정되지 않았습니다. 배포 환경변수를 확인하세요.', 'err');
    return;
  }

  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
  }

  await fetch('/api/subscribe', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(sub)
  });

  setStatus('알림 켜짐 ✅ 이 기기로 푸시를 받습니다.', 'ok');
}

subscribeBtn.addEventListener('click', registerServiceWorkerAndSubscribe);
testBtn.addEventListener('click', async () => {
  await fetch('/api/test-notify', { method:'POST' });
  setStatus('테스트 알림을 전송했습니다. 잠시 후 확인해보세요.', 'ok');
});

// init
loadSettings();
loadRates();
setInterval(loadRates, 60 * 1000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
if ('Notification' in window && Notification.permission === 'granted') {
  setStatus('알림 권한: 허용됨 ✅', 'ok');
} else {
  setStatus('알림 상태: "폰 알림 켜기" 버튼을 눌러주세요.');
}
</script>
</body>
</html>
